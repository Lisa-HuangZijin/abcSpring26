<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <title>Bead Curtain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  </style>
</head>
<body>

  <!-- ── Photo picker overlay ── -->
  <div id="photo-overlay">
    <div id="photo-card">
      <p id="photo-title">Choose a photo</p>
      <p id="photo-subtitle">We'll pull 5 colors from it for your beads</p>

      <!-- Preview + swatches, hidden until image chosen -->
      <div id="preview-area" style="display:none">
        <img id="preview-img" alt="preview" />
        <div id="swatches"></div>
      </div>

      <label id="pick-btn">
        📷 Pick a photo
        <input type="file" id="photo-input" accept="image/*" style="display:none" />
      </label>

      <button id="finish-btn" disabled>Finish →</button>
    </div>
  </div>

  <!-- ── Main curtain UI (hidden until Finish) ── -->
  <div id="p5-canvas-container" style="display:none"></div>
  <div id="legend" style="display:none"><span id="legend-dot"></span>your chain(s)</div>
  <button id="addchainButton" style="display:none">＋ Add my chain</button>

  <link rel="stylesheet" type="text/css" href="style.css">

  <script src="lib/p5.js"></script>
  <script src="lib/p5.sound.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
